# Throwaway test stack (db + rest). Values here are test-only, never real secrets.
# Parallel checkouts: docker compose -p <name> -f compose.test.yml up -d, with TEST_DB_PORT / TEST_REST_PORT set.
services:
  db:
    build: ./db
    environment:
      POSTGRES_PASSWORD: test-postgres-password
    ports:
      - "${TEST_DB_PORT:-54329}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      timeout: 3s
      retries: 30

  rest:
    image: postgrest/postgrest:v14.1
    environment:
      PGRST_DB_URI: postgres://authenticator:test-postgres-password@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_JWT_SECRET: test-jwt-secret-at-least-32-characters-long
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
    ports:
      - "${TEST_REST_PORT:-54330}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 2s
      timeout: 3s
      retries: 30
