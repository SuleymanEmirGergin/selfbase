# selfbase stack. Values come from .env (see .env.example). Only core is published.
services:
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30

  rest:
    image: postgrest/postgrest:v14.1
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${CORE_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SITE_URL: ${SITE_URL}
      AUTH_REDIRECT_ALLOWLIST: ${AUTH_REDIRECT_ALLOWLIST:-}
      AUTH_CONFIRM_EMAIL: ${AUTH_CONFIRM_EMAIL:-true}
      AUTH_PHONE_ENABLED: ${AUTH_PHONE_ENABLED:-false}
      AUTH_MIN_PASSWORD: ${AUTH_MIN_PASSWORD:-8}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PANEL_ADMIN_EMAIL: ${PANEL_ADMIN_EMAIL:-}
      PANEL_ADMIN_PASSWORD_HASH: ${PANEL_ADMIN_PASSWORD_HASH:-}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
      FUNCTIONS_DIR: ${FUNCTIONS_DIR:-}
      PGRST_URL: ${PGRST_URL:-http://rest:3000}
      FN_URL: ${FN_URL:-http://fn:8000}
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Deno function host. SUPABASE_DIR is the host path of the app's supabase/ folder (functions/ + config.toml);
  # unset, an empty placeholder is mounted and every function name answers 404.
  fn:
    build: ./fn
    restart: unless-stopped
    env_file:
      - path: fn.env
        required: false
    environment:
      SUPABASE_URL: http://core:8080
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      JWT_SECRET: ${JWT_SECRET}
      FUNCTIONS_DIR: /supabase/functions
    volumes:
      - ${SUPABASE_DIR:-./fn/empty}:/supabase:ro
      - ./client/dist:/client:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8000"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Daily backup (03:15 UTC) of the database and the storage volume, see scripts/backup.sh.
  # One-shot: docker compose run --rm backup /scripts/backup.sh   Restore: scripts/restore.sh <timestamp>
  backup:
    image: postgres:17
    init: true # bash in --daily mode would ignore SIGTERM as PID 1
    restart: unless-stopped
    command: ["bash", "/scripts/backup.sh", "--daily"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - storage:/data/storage:ro
      - ${BACKUP_DIR:-backups}:/backups
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  storage:
  backups:
