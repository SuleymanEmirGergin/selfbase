# selfbase stack. Values come from .env (see .env.example). Only core is published, on loopback by default (CORE_BIND).
services:
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30

  rest:
    image: postgrest/postgrest:v14.1
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${CORE_BIND:-127.0.0.1}:${CORE_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL (public https origin of core)}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SITE_URL: ${SITE_URL:?set SITE_URL (the app origin)}
      AUTH_REDIRECT_ALLOWLIST: ${AUTH_REDIRECT_ALLOWLIST:-}
      AUTH_CONFIRM_EMAIL: ${AUTH_CONFIRM_EMAIL:-true}
      AUTH_SECURE_EMAIL_CHANGE: ${AUTH_SECURE_EMAIL_CHANGE:-true}
      AUTH_REFRESH_REUSE_INTERVAL: ${AUTH_REFRESH_REUSE_INTERVAL:-10}
      AUTH_SET_PASSWORD_URL: ${AUTH_SET_PASSWORD_URL:-}
      AUTH_RATE_LIMIT_SIGN_IN: ${AUTH_RATE_LIMIT_SIGN_IN:-30}
      AUTH_RATE_LIMIT_VERIFY: ${AUTH_RATE_LIMIT_VERIFY:-30}
      AUTH_RATE_LIMIT_REFRESH: ${AUTH_RATE_LIMIT_REFRESH:-150}
      AUTH_RATE_LIMIT_EMAIL: ${AUTH_RATE_LIMIT_EMAIL:-30}
      AUTH_PHONE_ENABLED: ${AUTH_PHONE_ENABLED:-false}
      AUTH_MIN_PASSWORD: ${AUTH_MIN_PASSWORD:-6}
      AUTH_OTP_EXPIRY: ${AUTH_OTP_EXPIRY:-3600}
      AUTH_EMAIL_INTERVAL: ${AUTH_EMAIL_INTERVAL:-60}
      AUTH_SMS_HOOK_SECRET: ${AUTH_SMS_HOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_AUTH_URL: ${GOOGLE_AUTH_URL:-https://accounts.google.com/o/oauth2/v2/auth}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL:-https://oauth2.googleapis.com/token}
      GOOGLE_USERINFO_URL: ${GOOGLE_USERINFO_URL:-https://openidconnect.googleapis.com/v1/userinfo}
      PANEL_ADMIN_EMAIL: ${PANEL_ADMIN_EMAIL:-}
      PANEL_ADMIN_PASSWORD_HASH: ${PANEL_ADMIN_PASSWORD_HASH:-}
      STORAGE_DIR: /data/storage # fixed: it is the storage volume's mount point below
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-52428800}
      PGRST_URL: ${PGRST_URL:-http://rest:3000}
      FN_URL: ${FN_URL:-http://fn:8000}
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Deno function host. SUPABASE_DIR is the host path of the app's supabase/ folder (functions/ + config.toml);
  # unset, an empty placeholder is mounted and every function name answers 404.
  fn:
    build: ./fn
    restart: unless-stopped
    env_file:
      - path: fn.env
        required: false
    environment:
      SUPABASE_URL: http://core:8080
      SUPABASE_ANON_KEY: ${ANON_KEY:?set ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY}
      # No SUPABASE_DB_URL: functions pull third-party code at runtime and get no database credentials.
      # A function that really needs direct DB access gets it from fn.env, added there deliberately.
      JWT_SECRET: ${JWT_SECRET}
      FUNCTIONS_DIR: /supabase/functions
      FN_IMPORT_TIMEOUT_MS: ${FN_IMPORT_TIMEOUT_MS:-30000}
    volumes:
      - ${SUPABASE_DIR:-./fn/empty}:/supabase:ro
      - ./client/dist:/client:ro
      - denocache:/deno-dir # downloaded function dependencies survive restarts
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8000"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Daily backup (03:15 UTC) of the database and the storage volume, see scripts/backup.sh.
  # One-shot: docker compose run --rm backup /scripts/backup.sh   Restore: scripts/restore.sh <timestamp>
  backup:
    image: postgres:17
    init: true # bash in --daily mode would ignore SIGTERM as PID 1
    restart: unless-stopped
    command: ["bash", "/scripts/backup.sh", "--daily"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - storage:/data/storage:ro
      - ${BACKUP_DIR:-backups}:/backups
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  storage:
  backups:
  denocache:
