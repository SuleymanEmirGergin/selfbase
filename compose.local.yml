# Local development only: publishes the database on localhost so the host-side scripts
# (scripts/migrate/05 and 06, through TARGET_DB_URL_HOST) can reach it. scripts/sync.mjs does not need it:
# it runs psql in a container through TARGET_DB_URL and DOCKER_NETWORK. Never use on a server.
services:
  db:
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-55432}:5432"
