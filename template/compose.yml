# selfbase project template (spec 7.2, AC-4). The provisioner reads this file as a strict subset of compose
# (provisioner/src/template.ts): services and volumes only; per service image, command, environment, volumes,
# depends_on, healthcheck, init, user, stop_grace_period. Limits come from sizes.json; restart policy, logging,
# networks and Traefik labels are the provisioner's. Check: node provisioner/src/template.ts --check template/compose.yml
# Local run (adds build, restart, the published core port and the project name):
#   docker compose -f template/compose.yml -f template/compose.build.yml --env-file .env up -d --build
# REGISTRY, TEMPLATE_VERSION, PROJECT_SUBNET, DB_SHARED_BUFFERS, DB_MAX_CONNECTIONS, POOL_SIZE, DB_HOST, PGRST_URL,
# FN_URL and TRUSTED_PROXY_IPS are set by the provisioner; a project env value for any of them is ignored.
services:
  db:
    image: ${REGISTRY}/selfbase-db:${TEMPLATE_VERSION}
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=postgres", "-c", "wal_level=logical",
      "-c", "shared_buffers=${DB_SHARED_BUFFERS:-128MB}", "-c", "max_connections=${DB_MAX_CONNECTIONS:-60}"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Exits until core has migrated and set the authenticator password; the restart policy brings it back.
  rest:
    image: ${REGISTRY}/selfbase-rest:${TEMPLATE_VERSION}
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?set AUTHENTICATOR_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
    depends_on: [db]
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Public port 8080 (the only one the proxy routes to); admin API on 8081, project network only (AC-5).
  core:
    image: ${REGISTRY}/selfbase-core:${TEMPLATE_VERSION}
    init: true
    environment:
      # core is also on the shared proxy network, where a bare name may resolve to a foreign container first: the
      # provisioner sets these to <name>.sb-<ref> (resolved on the project network only); bare names for local compose
      DB_HOST: ${DB_HOST:-db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?set AUTHENTICATOR_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_PORT: "8081"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      PROJECT_REF: ${PROJECT_REF:-}
      # the project's /27: the admin port refuses any peer outside it (core is on the shared proxy network too)
      PROJECT_SUBNET: ${PROJECT_SUBNET:-}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL (public https origin of core)}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # X-Forwarded-For counts only from these peers (the proxy container's address); empty: from no peer
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      SITE_URL: ${SITE_URL:?set SITE_URL (the app origin)}
      AUTH_DISABLE_SIGNUP: ${AUTH_DISABLE_SIGNUP:-false}
      AUTH_REDIRECT_ALLOWLIST: ${AUTH_REDIRECT_ALLOWLIST:-}
      AUTH_CONFIRM_EMAIL: ${AUTH_CONFIRM_EMAIL:-true}
      AUTH_SECURE_EMAIL_CHANGE: ${AUTH_SECURE_EMAIL_CHANGE:-true}
      AUTH_REFRESH_REUSE_INTERVAL: ${AUTH_REFRESH_REUSE_INTERVAL:-10}
      AUTH_SET_PASSWORD_URL: ${AUTH_SET_PASSWORD_URL:-}
      AUTH_RATE_LIMIT_SIGN_IN: ${AUTH_RATE_LIMIT_SIGN_IN:-30}
      AUTH_RATE_LIMIT_VERIFY: ${AUTH_RATE_LIMIT_VERIFY:-30}
      AUTH_RATE_LIMIT_REFRESH: ${AUTH_RATE_LIMIT_REFRESH:-150}
      AUTH_RATE_LIMIT_EMAIL: ${AUTH_RATE_LIMIT_EMAIL:-30}
      AUTH_PHONE_ENABLED: ${AUTH_PHONE_ENABLED:-false}
      AUTH_MIN_PASSWORD: ${AUTH_MIN_PASSWORD:-6}
      AUTH_OTP_EXPIRY: ${AUTH_OTP_EXPIRY:-3600}
      AUTH_EMAIL_INTERVAL: ${AUTH_EMAIL_INTERVAL:-60}
      AUTH_SMS_HOOK_SECRET: ${AUTH_SMS_HOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_AUTH_URL: ${GOOGLE_AUTH_URL:-https://accounts.google.com/o/oauth2/v2/auth}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL:-https://oauth2.googleapis.com/token}
      GOOGLE_USERINFO_URL: ${GOOGLE_USERINFO_URL:-https://openidconnect.googleapis.com/v1/userinfo}
      STORAGE_DIR: /data/storage # fixed: the storage volume's mount point below
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-52428800}
      PGRST_URL: ${PGRST_URL:-http://rest:3000}
      FN_URL: ${FN_URL:-http://fn:8000}
      # net.http_* may not reach private, loopback or link-local addresses except these hosts (comma-separated)
      NETQUEUE_ALLOW_HOSTS: ${NETQUEUE_ALLOW_HOSTS:-}
    volumes:
      - storage:/data/storage
    # rest only started, not healthy: it can log in only after core has migrated (see rest)
    depends_on: [db, rest]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Deno function host. Functions come from the functions volume (written by deploys, spec 8.5); an empty
  # volume means every function name answers 404.
  fn:
    image: ${REGISTRY}/selfbase-fn:${TEMPLATE_VERSION}
    environment:
      SUPABASE_URL: http://core:8080
      SUPABASE_ANON_KEY: ${ANON_KEY:?set ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY}
      # No SUPABASE_DB_URL: functions pull third-party code at runtime and get no database credentials.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      FUNCTIONS_DIR: /supabase/functions
      FN_IMPORT_TIMEOUT_MS: ${FN_IMPORT_TIMEOUT_MS:-30000}
    volumes:
      - functions:/supabase:ro
      - denocache:/deno-dir # downloaded function dependencies survive restarts
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8000"]
      interval: 10s
      timeout: 3s
      retries: 10

  # PgBouncer, transaction pooling on 6432 (spec 8.9); pooler/entrypoint.sh writes its config.
  pooler:
    image: ${REGISTRY}/selfbase-pooler:${TEMPLATE_VERSION}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POOL_SIZE: ${POOL_SIZE:-15}
    depends_on: [db]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "6432"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  storage:
  functions:
  denocache:
