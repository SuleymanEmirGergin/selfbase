name: ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_COMPOSE_PROJECT: sb-ci
      TEST_COMPOSE_FILE: ../template/compose.test.yml # relative to a workspace directory
      TEST_DB_PORT: "54329"
      TEST_REST_PORT: "54330"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # rest is not in --wait: it exits and restarts until core's global setup has migrated db (which then waits for it)
      - run: docker compose -p sb-ci -f template/compose.test.yml up -d --build --wait db db-empty db-v1 && docker compose -p sb-ci -f template/compose.test.yml up -d rest
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present
      - run: node --test scripts/test/workspace.test.mjs scripts/test/compose-env.test.mjs scripts/test/template.test.mjs

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [db, core, fn, rest, pooler, job, control, provisioner]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ${{ matrix.image }}/Dockerfile -t selfbase-${{ matrix.image }}:ci .

  # The control stack end to end (test/e2e/README.md), plus the backup/restore job scripts in real containers.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx -w studio playwright install --with-deps chromium
      - run: node --test scripts/test/install-check.test.mjs scripts/test/gen-keys.test.mjs
      - run: bash job/test/job.test.sh
      - run: node --test --test-concurrency=1 test/e2e/teardown.test.mjs test/e2e/stack.test.mjs
